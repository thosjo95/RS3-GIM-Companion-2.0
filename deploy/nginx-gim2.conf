# GIM Companion 2.0 on the existing server, next to 1.x. Nothing here touches the 1.x site.
#
#   api.groupiron.com   the plugin and the dashboard talk to this (permanent: it is written into the plugin manifest)
#   beta.groupiron.com  the 2.0 dashboard while it is under review (later groupiron.com takes over; this one can go)
#
# Install:  sudo cp deploy/nginx-gim2.conf /etc/nginx/sites-available/gim2
#           sudo ln -s /etc/nginx/sites-available/gim2 /etc/nginx/sites-enabled/gim2
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d api.groupiron.com -d beta.groupiron.com     (adds HTTPS and the redirect)

# ── API: only /api is served ────────────────────────────────────────────────
server {
    listen 80;
    server_name api.groupiron.com;

    # a plugin update can carry a whole bank: allow a little more than the 1 MB the server accepts
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # the server trusts exactly one proxy
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}

# ── Dashboard (review period): static files + the same API ──────────────────
server {
    listen 80;
    server_name beta.groupiron.com;

    client_max_body_size 2m;
    root /opt/gim2/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri /index.html; }

    # fingerprinted build files can be cached for a long time
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
